name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/store.js
          node --check lib/crypto.js
          node --check lib/ssh.js
          node --check lib/diagnostics.js
          node --check lib/tools.js
          node --check lib/client.js
      - name: Test
        run: node --test
      - name: Build client
        run: npm run build
