name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/store.js
          node --check lib/crypto.js
          node --check lib/ssh.js
          node --check lib/tools.js
          node --check lib/client.js
      - name: Test
        run: node --test
