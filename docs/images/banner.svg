<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="dsh-aixterm — shared SSH/SFTP sessions for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title { fill: #f8fafc; font-weight: 700; }
      .sub { fill: #94a3b8; }
      .chipbg { fill: #111c2e; stroke: #24314a; stroke-width: 1; }
      .chiptx { fill: #cbd5e1; }
      .termline { fill: #7ee787; }
      .termdim { fill: #64748b; }
      .cursor { fill: #34d399; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="258" rx="20" fill="url(#bg)" stroke="#1e293b"/>

  <!-- terminal window -->
  <rect x="52" y="52" width="252" height="156" rx="12" fill="#0b1220" stroke="#24314a" stroke-width="1.5"/>
  <circle cx="72" cy="71" r="4" fill="#f87171"/>
  <circle cx="86" cy="71" r="4" fill="#fbbf24"/>
  <circle cx="100" cy="71" r="4" fill="#34d399"/>
  <text x="72" y="104" class="mono termline" font-size="13">$ ssh deploy@prod</text>
  <text x="72" y="126" class="mono termdim" font-size="12">Connected · ubuntu 24.04</text>
  <text x="72" y="148" class="mono termline" font-size="13">$ uptime</text>
  <text x="72" y="170" class="mono termdim" font-size="12">up 42 days, load 0.08</text>
  <rect x="72" y="182" width="9" height="13" class="cursor"/>
  <text x="90" y="193" class="mono termdim" font-size="11">human &amp; agent</text>

  <!-- text -->
  <text x="350" y="112" class="mono title" font-size="46">dsh-aixterm</text>
  <text x="350" y="150" class="sans sub" font-size="20">Shared SSH / SFTP sessions for DeepSeek Harness</text>

  <!-- chips -->
  <g class="sans" font-size="14">
    <g transform="translate(350,180)">
      <rect width="140" height="30" rx="15" class="chipbg"/>
      <text x="16" y="20" class="chiptx">human + agent</text>
    </g>
    <g transform="translate(502,180)">
      <rect width="118" height="30" rx="15" class="chipbg"/>
      <text x="16" y="20" class="chiptx">SSH · SFTP</text>
    </g>
    <g transform="translate(632,180)">
      <rect width="150" height="30" rx="15" class="chipbg"/>
      <text x="16" y="20" class="chiptx">sidebar page</text>
    </g>
  </g>
</svg>
